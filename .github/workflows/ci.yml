name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -recursive -check infra/terraform

      - name: Validate and test the vsphere-estate module
        working-directory: infra/terraform/modules/vsphere-estate
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Validate the lab environment
        working-directory: infra/terraform/environments/lab
        run: |
          terraform init -backend=false
          terraform validate

  ansible:
    name: Ansible (lint + role tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core ansible-lint

      - name: Run role tests
        working-directory: infra/ansible
        run: ./tests/run-tests.sh

  helm:
    name: Helm chart (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Lint and render the platform-api chart
        run: helm/platform-api/tests/run-tests.sh

  observability:
    name: Observability (config checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus config
        working-directory: observability
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus check config /etc/prometheus/prometheus.yml

      - name: Check Prometheus alert rules
        working-directory: observability
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus check rules /etc/prometheus/rules/platform-api.yml

      - name: Check Alertmanager config
        working-directory: observability
        run: |
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager check-config /etc/alertmanager/alertmanager.yml
