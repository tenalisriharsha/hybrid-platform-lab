---
# Source: platform-api/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api
    app.kubernetes.io/version: "2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: platform-api-0.1.0

---
# Source: platform-api/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api
    app.kubernetes.io/version: "2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: platform-api-0.1.0
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api

---
# Source: platform-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api
    app.kubernetes.io/version: "2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: platform-api-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/instance: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/instance: platform-api
    spec:
      serviceAccountName: platform-api
      containers:
        - name: platform-api
          image: "hybrid-platform-lab-platform-api:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
