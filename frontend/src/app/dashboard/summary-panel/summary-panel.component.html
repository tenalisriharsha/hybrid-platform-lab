<div class="panel">
  <div class="panel__header">
    <h2>Platform health</h2>
    <app-status-badge [status]="healthBadge.status" [label]="healthBadge.label" />
  </div>

  @if (summary) {
    <div class="tile-row">
      <app-stat-tile label="Hosts" [value]="summary.hostCount" />
      <app-stat-tile
        label="VMs"
        [value]="summary.vmCount"
        [sublabel]="summary.vmsPoweredOn + ' on · ' + summary.vmsPoweredOff + ' off · ' + summary.vmsSuspended + ' suspended'"
      />
      <app-stat-tile label="Datastores" [value]="summary.datastoreCount" />
      <app-stat-tile
        label="Datastore capacity"
        [value]="summary.totalDatastoreFreeGb + ' / ' + summary.totalDatastoreCapacityGb + ' GB free'"
      />
    </div>
  } @else if (summaryError) {
    <p class="panel__error">Could not load the inventory summary from platform-api.</p>
  } @else {
    <p class="panel__loading">Loading summary…</p>
  }
</div>
