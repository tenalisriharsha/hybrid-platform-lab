groups:
  - name: platform-api
    rules:
      - alert: PlatformApiDown
        expr: up{job="platform-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "platform-api is down"
          description: "Prometheus has not been able to scrape platform-api for 1 minute."

      - alert: PlatformApiHighErrorRate
        expr: >-
          (
            sum(rate(http_server_requests_seconds_count{job="platform-api",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="platform-api"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "platform-api 5xx error rate above 5%"
          description: "More than 5% of platform-api requests have returned a 5xx status over the last 5 minutes."

      - alert: PlatformApiNoInventory
        expr: platform_inventory_hosts == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "platform-api has zero hosts in inventory"
          description: "platform_inventory_hosts has been 0 for 5 minutes — the inventory may be unsynced or the estate is empty."
