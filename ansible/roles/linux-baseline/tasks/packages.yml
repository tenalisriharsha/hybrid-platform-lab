---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ linux_baseline_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
