---
- name: Install node_exporter package
  ansible.builtin.apt:
    name: "{{ linux_baseline_node_exporter_package }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: "{{ linux_baseline_node_exporter_service_name }}"
    enabled: true
    state: started
  when: linux_baseline_manage_services | bool
