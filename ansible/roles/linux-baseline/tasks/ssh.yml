---
- name: Harden sshd_config - PermitRootLogin
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*PermitRootLogin\\s"
    line: "PermitRootLogin {{ linux_baseline_ssh_permit_root_login }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Harden sshd_config - PasswordAuthentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*PasswordAuthentication\\s"
    line: "PasswordAuthentication {{ linux_baseline_ssh_password_authentication }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Harden sshd_config - X11Forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*X11Forwarding\\s"
    line: "X11Forwarding {{ linux_baseline_ssh_x11_forwarding }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Harden sshd_config - MaxAuthTries
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*MaxAuthTries\\s"
    line: "MaxAuthTries {{ linux_baseline_ssh_max_auth_tries }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Harden sshd_config - ClientAliveInterval
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*ClientAliveInterval\\s"
    line: "ClientAliveInterval {{ linux_baseline_ssh_client_alive_interval }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
