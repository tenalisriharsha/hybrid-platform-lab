; Example inventory for applying the linux-baseline role to real hosts.
; Copy this file, fill in real addresses/credentials, and point
; ansible-playbook at it with -i. Never commit real inventory data.

[linux_hosts]
lab-vm-01.example.internal
lab-vm-02.example.internal

[linux_hosts:vars]
ansible_user=ansible
ansible_become=true
linux_baseline_manage_services=true
