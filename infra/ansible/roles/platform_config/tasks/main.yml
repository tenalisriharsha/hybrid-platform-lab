---
- name: Validate platform_config inputs
  ansible.builtin.assert:
    that:
      - platform_config_env in ["lab", "staging", "prod"]
      - platform_config_api_port | int > 0
      - platform_config_api_port | int <= 65535
      - platform_config_vcsim_port | int > 0
      - platform_config_vcsim_port | int <= 65535
      - platform_config_sync_interval_seconds | int >= 30
    fail_msg: >-
      Invalid platform_config variables: platform_config_env,
      platform_config_api_port, platform_config_vcsim_port, and
      platform_config_sync_interval_seconds must be within their allowed
      ranges.
    quiet: true

- name: Ensure the environment config output directory exists
  ansible.builtin.file:
    path: "{{ platform_config_output_dir }}"
    state: directory
    mode: "0755"

- name: Render platform-api Spring Boot config overlay
  ansible.builtin.template:
    src: application.yml.j2
    dest: "{{ platform_config_output_dir }}/application.yml"
    mode: "0644"

- name: Render HybridPlatformSync connection config
  ansible.builtin.template:
    src: hybrid-platform-sync.json.j2
    dest: "{{ platform_config_output_dir }}/hybrid-platform-sync.json"
    mode: "0644"
